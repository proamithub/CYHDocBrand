# Nginx Reverse Proxy Configuration for CYH DoctorHub
# Supports Blazor Web App Interactive Server WebSockets

server {
    listen 80;
    server_name your-doctorhub-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-doctorhub-domain.com;

    ssl_certificate /etc/letsencrypt/live/your-doctorhub-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-doctorhub-domain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SignalR circuit ping & timeout tuning
    proxy_read_timeout 100s;
    proxy_send_timeout 100s;
}
