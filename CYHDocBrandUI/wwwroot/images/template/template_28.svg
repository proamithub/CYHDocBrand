<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad28" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082622" />
      <stop offset="50%" stop-color="#104239" />
      <stop offset="100%" stop-color="#082622" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accGrad28" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow28" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Canvas Fill -->
  <rect width="1080" height="1080" fill="url(#bgGrad28)" />

  <!-- Ambient Light Orbs -->
  <circle cx="850" cy="220" r="280" fill="#34d399" opacity="0.12" filter="url(#glow28)" />
  <circle cx="200" cy="850" r="320" fill="#34d399" opacity="0.08" filter="url(#glow28)" />

  <!-- Geometric Tech Grid Overlay -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="1080" />
    <line x1="200" y1="0" x2="200" y2="1080" />
    <line x1="320" y1="0" x2="320" y2="1080" />
    <line x1="440" y1="0" x2="440" y2="1080" />
    <line x1="560" y1="0" x2="560" y2="1080" />
    <line x1="680" y1="0" x2="680" y2="1080" />
    <line x1="800" y1="0" x2="800" y2="1080" />
    <line x1="920" y1="0" x2="920" y2="1080" />
    <line x1="1000" y1="0" x2="1000" y2="1080" />

    <line x1="0" y1="80" x2="1080" y2="80" />
    <line x1="0" y1="200" x2="1080" y2="200" />
    <line x1="0" y1="320" x2="1080" y2="320" />
    <line x1="0" y1="440" x2="1080" y2="440" />
    <line x1="0" y1="560" x2="1080" y2="560" />
    <line x1="0" y1="680" x2="1080" y2="680" />
    <line x1="0" y1="800" x2="1080" y2="800" />
    <line x1="0" y1="920" x2="1080" y2="920" />
  </g>

  <!-- Modern Medical Diagonal / Curve Brand Accent -->
  <path d="M-50,280 C250,220 400,380 750,260 C900,210 1020,290 1150,240 L1150,-50 L-50,-50 Z" fill="#34d399" opacity="0.05" />
  <path d="M-50,780 C300,720 520,880 820,760 C960,710 1060,820 1150,780 L1150,1150 L-50,1150 Z" fill="#104239" opacity="0.5" />

  <!-- Distinctive Category Artwork Wave / Shapes -->
  <g stroke="#34d399" stroke-width="3" fill="none" opacity="0.45">
    <path d="M60,640 L280,640 L310,610 L340,680 L380,560 L420,700 L450,620 L480,640 L980,640" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Abstract Medical Hexagons & Rings -->
  <g opacity="0.25">
    <polygon points="860,180 910,210 910,270 860,300 810,270 810,210" stroke="#34d399" stroke-width="2" fill="none" />
    <polygon points="940,250 990,280 990,340 940,370 890,340 890,280" stroke="#34d399" stroke-width="1.5" fill="none" opacity="0.6" />
    <circle cx="860" cy="240" r="16" fill="#34d399" opacity="0.5" />
  </g>

  <!-- Outer Luxury Tech Border -->
  <rect x="25" y="25" width="1030" height="1030" rx="32" ry="32" fill="none" stroke="#34d399" stroke-width="2" opacity="0.3" />
  <rect x="35" y="35" width="1010" height="1010" rx="24" ry="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.08" />

  <!-- Corner Tech Accents -->
  <path d="M45,110 L45,45 L110,45" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" />
  <path d="M1035,110 L1035,45 L970,45" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" />
  <path d="M45,970 L45,1035 L110,1035" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" />
  <path d="M1035,970 L1035,1035 L970,1035" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" />

  <!-- Semi-transparent bottom card zone for doctor branding & contacts -->
  <rect x="60" y="800" width="960" height="210" rx="24" ry="24" fill="#030814" opacity="0.75" stroke="#34d399" stroke-width="1.5" />
  <line x1="60" y1="800" x2="1020" y2="800" stroke="url(#accGrad28)" stroke-width="3" />

  <!-- Subtle watermark / signature -->
  <text x="1000" y="780" text-anchor="end" font-family="sans-serif" font-size="16" font-weight="700" fill="#34d399" opacity="0.5" letter-spacing="3">CYH TEMPLATE #28</text>
</svg>