<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Cyan to Royal Blue Gradient -->
    <linearGradient id="cyhGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Deep Space Midnight Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b38" />
      <stop offset="100%" stop-color="#050a17" />
    </linearGradient>

    <!-- Glowing Heart Pulse Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00f2fe" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle App Icon Container -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="url(#cyhGrad)" stroke-width="3" />

  <!-- Medical Cross / Heart Badge in Center-Top -->
  <g transform="translate(64, 38)" filter="url(#cyanGlow)">
    <!-- Heart Path Background -->
    <path d="M0 -14 C-8 -26 -24 -20 -24 -6 C-24 8 0 20 0 20 C0 20 24 8 24 -6 C24 -20 8 -26 0 -14 Z" fill="url(#cyhGrad)" opacity="0.95" />
    <!-- Medical Heartbeat ECG Pulse Line -->
    <path d="M-15 0 L-7 0 L-3 -8 L2 10 L5 -4 L8 2 L15 2" fill="none" stroke="#050a17" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Prominent "CYH" Brand Typography -->
  <text x="64" y="94" 
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" 
        font-weight="900" 
        font-size="34" 
        text-anchor="middle" 
        letter-spacing="1.5" 
        fill="#ffffff">
    CY<tspan fill="#00f2fe">H</tspan>
  </text>

  <!-- Accent Pulse Baseline -->
  <path d="M30 106 L52 106 L57 101 L62 110 L67 104 L71 106 L98 106" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="2.2" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
