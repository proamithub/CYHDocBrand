services:
  cyhdocbrand-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: cyhdocbrand-web:latest
    container_name: cyhdocbrand-web
    restart: always
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      # VPS SQL Server Connection String (Override with actual SQL Host, User, Password)
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal,1433;Database=CYHDocBrandBD;User Id=sa;Password=YourSqlPassword123;TrustServerCertificate=True;MultipleActiveResultSets=true;
    extra_hosts:
      - "host.docker.internal:host-gateway"
